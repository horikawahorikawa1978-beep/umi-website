<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

</head>
<body>
<header><div class="wrap nav"><a href="index.html"><img class="nav-logo" src="umi-logo.png" alt="Umi"></a>
<nav class="navlinks"><a href="about.html">ABOUT</a><a href="philosophy.html">PHILOSOPHY</a><a href="brand.html">BRAND</a><a href="company.html">COMPANY</a><a class="contact is-current" href="contact.html">CONTACT</a></nav></div></header>
<main class="contact-page">
<section class="contact-title"><div class="wrap contact-title-inner"><p class="contact-kicker">CONTACT</p><h1>お問い合わせ</h1><div class="contact-gold-line"></div><p class="contact-intro">商品・お取引・その他のお問い合わせは、<br class="pc-only">下記フォームよりお気軽にお問い合わせください。</p></div></section>
<section class="contact-form-section"><div class="wrap contact-form-wrap">
<form class="umi-contact-form" action="https://formspree.io/f/mnpakvyg" method="POST">
<div class="contact-field"><label for="name">お名前 <span>必須</span></label><input id="name" name="お名前" type="text" required></div>
<div class="contact-field"><label for="email">メールアドレス <span>必須</span></label><input id="email" name="email" type="email" required></div>
<div class="contact-field"><label for="company">会社名 <small>任意</small></label><input id="company" name="会社名" type="text"></div>
<div class="contact-field"><label for="category">お問い合わせ種別 <span>必須</span></label><select id="category" name="お問い合わせ種別" required><option value="" selected disabled>選択してください</option><option>商品について</option><option>お取引・卸について</option><option>取材・メディアについて</option><option>その他</option></select></div>
<div class="contact-field"><label for="message">お問い合わせ内容 <span>必須</span></label><textarea id="message" name="お問い合わせ内容" rows="8" required></textarea></div>
<input type="hidden" name="_subject" value="Umi公式サイト お問い合わせ">
<div class="contact-submit"><button type="submit">SEND <b>→</b></button></div></form>
<p class="contact-note">ご入力いただいた内容を確認のうえ、担当者よりご連絡いたします。</p>
</div></section></main>
